bundle:
  name: alderbrook

include:
  - databricks/jobs.yml

targets:
  local:
    mode: development
    default: true
    workspace:
      host: ${DATABRICKS_HOST}
  prod:
    mode: production
    workspace:
      host: ${DATABRICKS_HOST}
      root_path: /Workspace/acn/alderbrook

variables:
  catalog:
    default: acn_prod
  salt_secret_scope:
    default: alderbrook
