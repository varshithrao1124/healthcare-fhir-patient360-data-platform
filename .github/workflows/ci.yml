name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
      ACN_TOKEN_SALT: local-dev-salt-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Tests and coverage
        run: python -m pytest --cov=acn_interop --cov-report=term-missing --cov-report=xml
      - name: Local pipeline smoke
        run: python -m acn_interop.jobs.run_local --profile smoke --lake data/smoke-lake --evidence data/smoke-evidence
